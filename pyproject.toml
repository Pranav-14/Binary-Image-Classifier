[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binary-image-classifier"
version = "2.0.0"
description = "Urban Sanitation & Environmental Intelligence: Binary Image Classifier (Clean vs Garbage)"
authors = [{ name = "Pranav", email = "pranav@example.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnxruntime>=1.15.0",
    "fastapi>=0.98.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "pillow>=9.5.0",
    "opencv-python-headless>=4.7.0.72",
    "numpy>=1.23.5",
    "rich>=13.4.0"
]

[project.scripts]
imgcl = "src.cli:main"
